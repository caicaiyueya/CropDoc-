<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="820" viewBox="0 0 920 820">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fbf8"/>
      <stop offset="100%" stop-color="#eef5f0"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#28b446"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a6b5f"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a5a9a"/>
    </marker>
  </defs>

  <rect width="920" height="820" fill="url(#bg)"/>
  <text x="460" y="42" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="700" fill="#1f3d2a">云农智诊系统总体架构图</text>
  <text x="460" y="68" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#5a6b5f">基于 NFNet-F1 与大语言模型的农业智能问诊系统</text>

  <!-- ===== 用户层 ===== -->
  <rect x="40" y="88" width="840" height="96" rx="12" fill="#ffffff" stroke="#cfe8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="118" width="320" height="54" rx="8" fill="url(#green)"/>
  <text x="460" y="143" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff">微信小程序（用户端）</text>
  <text x="460" y="161" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#eaffef">首页 | 识别 | 问诊 | 社区 | 我的</text>

  <!-- ===== 业务层 ===== -->
  <rect x="40" y="188" width="840" height="108" rx="12" fill="#ffffff" stroke="#cfe8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="120" y="222" width="180" height="58" rx="8" fill="#e8f7ec" stroke="#28b446" stroke-width="1.2"/>
  <text x="210" y="246" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="700" fill="#1f3d2a">api 云函数</text>
  <text x="210" y="266" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#5a6b5f">识别 / 问诊 / 社区 / 资讯</text>
  <rect x="370" y="222" width="180" height="58" rx="8" fill="#e8f7ec" stroke="#28b446" stroke-width="1.2"/>
  <text x="460" y="246" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="700" fill="#1f3d2a">admin 云函数</text>
  <text x="460" y="266" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#5a6b5f">内容审核 / 后台管理</text>
  <rect x="620" y="222" width="180" height="58" rx="8" fill="#e8f7ec" stroke="#28b446" stroke-width="1.2"/>
  <text x="710" y="246" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="700" fill="#1f3d2a">init-db / cron-news</text>
  <text x="710" y="266" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#5a6b5f">初始化 / 定时资讯</text>

  <!-- ===== 数据层 ===== -->
  <rect x="40" y="400" width="400" height="118" rx="12" fill="#ffffff" stroke="#cfe8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="444" width="150" height="58" rx="8" fill="#fff8e8" stroke="#e6b422" stroke-width="1.2"/>
  <text x="145" y="468" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="700" fill="#6b5610">云数据库</text>
  <text x="145" y="488" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#8a7340">users / detect_records / posts</text>
  <rect x="260" y="444" width="150" height="58" rx="8" fill="#fff8e8" stroke="#e6b422" stroke-width="1.2"/>
  <text x="335" y="468" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="700" fill="#6b5610">云存储</text>
  <text x="335" y="488" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#8a7340">用户识别图片 / 封面图</text>

  <!-- ===== 智能服务层 ===== -->
  <rect x="480" y="400" width="400" height="118" rx="12" fill="#ffffff" stroke="#cfe8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="510" y="444" width="150" height="58" rx="8" fill="#eef3ff" stroke="#4a7cff" stroke-width="1.2"/>
  <text x="585" y="466" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#234080">云托管 ai-service</text>
  <text x="585" y="486" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#4a6080">NFNet-F1 /predict 88类</text>
  <rect x="700" y="444" width="150" height="58" rx="8" fill="#eef3ff" stroke="#4a7cff" stroke-width="1.2"/>
  <text x="775" y="466" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#234080">DeepSeek API</text>
  <text x="775" y="486" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#4a6080">智能诊断 / 多轮问答</text>

  <!-- ===== 管理端 ===== -->
  <rect x="40" y="538" width="840" height="86" rx="12" fill="#ffffff" stroke="#cfe8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="570" width="320" height="42" rx="8" fill="#f3ecff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="460" y="597" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="700" fill="#4c2d80">Vue3 管理后台 admin-web</text>

  <!-- ===== 箭头（在模块框之后、标签之前绘制） ===== -->
  <line x1="460" y1="184" x2="460" y2="188" stroke="#5a6b5f" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 210 280 L 210 322 L 145 322 L 145 444" fill="none" stroke="#5a6b5f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 210 280 L 210 342 L 335 342 L 335 444" fill="none" stroke="#5a6b5f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 210 280 L 210 362 L 585 362 L 585 444" fill="none" stroke="#5a6b5f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 210 280 L 210 382 L 775 382 L 775 444" fill="none" stroke="#5a6b5f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M 460 280 L 460 538" fill="none" stroke="#7a5a9a" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <path d="M 300 591 L 24 591 L 24 246 L 370 246" fill="none" stroke="#7a5a9a" stroke-width="1.4" marker-end="url(#arrowPurple)"/>

  <!-- ===== 箭头标签（绘制顺序在层标题之前） ===== -->
  <rect x="516.0" y="179.0" width="74.0" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="518.0" y="188.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">callFunction</text>
  <rect x="163.5" y="307.0" width="29.0" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="178.0" y="316.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">读写</text>
  <rect x="257.5" y="327.0" width="29.0" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="272.0" y="336.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">上传</text>
  <rect x="369.8" y="347.0" width="56.5" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="398.0" y="356.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">HTTP 识别</text>
  <rect x="591.8" y="367.0" width="56.5" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="620.0" y="376.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">HTTP 问诊</text>
  <rect x="476.0" y="321.0" width="52.0" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="478.0" y="330.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">HTTP API</text>
  <rect x="-1.0" y="309.0" width="50.0" height="14.0" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="24.0" y="318.0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="400" fill="#3d4f44">管理请求</text>

  <!-- ===== 层标题（最后绘制，带底框，避免被遮挡） ===== -->
  <rect x="56.0" y="97.0" width="48.9" height="18" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="58.0" y="110.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#28b446">用户层</text>
  <rect x="56.0" y="197.0" width="138.7" height="18" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="58.0" y="210.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#28b446">业务层 / 微信云开发</text>
  <rect x="56.0" y="409.0" width="48.9" height="18" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="58.0" y="422.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#28b446">数据层</text>
  <rect x="496.0" y="409.0" width="76.2" height="18" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="498.0" y="422.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#28b446">智能服务层</text>
  <rect x="56.0" y="547.0" width="48.9" height="18" rx="3" fill="#ffffff" fill-opacity="0.97" stroke="#d0ddd4" stroke-width="0.6"/>
  <text x="58.0" y="560.0" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="700" fill="#28b446">管理端</text>

  <!-- ===== 数据流说明 ===== -->
  <rect x="40" y="648" width="840" height="118" rx="10" fill="#ffffff" stroke="#d8e8dc" stroke-width="1"/>
  <text x="60" y="674" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" font-weight="700" fill="#1f3d2a">数据流说明</text>
  <text x="60" y="698" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#5a6b5f">① 用户上传图片至云存储</text>
  <text x="60" y="718" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#5a6b5f">② api 云函数 HTTP 调用云托管 NFNet-F1 完成识别</text>
  <text x="60" y="738" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#5a6b5f">③ 识别结果写入云数据库</text>
  <text x="460" y="698" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#5a6b5f">④ 问诊模块调用 DeepSeek API</text>
  <text x="460" y="718" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#5a6b5f">⑤ 管理后台通过 HTTP 调用 admin 云函数</text>
  <text x="460" y="738" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#5a6b5f">⑥ init-db / cron-news 负责初始化与定时资讯</text>
</svg>
